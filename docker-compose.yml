services:
  postgres:
    image: postgres:15-alpine
    container_name: barbersaas-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: barbersaas
      POSTGRES_PASSWORD: barbersaas_dev_2024
      POSTGRES_DB: barbersaas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U barbersaas']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: barbersaas-network
