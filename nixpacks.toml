# Configuração Nixpacks para Railway
# Build apenas a API do BarberSaas

[phases.setup]
nixPkgs = ["nodejs_22", "npm-9_x", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["cd apps/api && npm install && npx prisma generate && npm run build"]

[start]
cmd = "cd apps/api && npx prisma migrate deploy && node dist/src/main"

[variables]
NODE_ENV = "production"
