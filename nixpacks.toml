# Configuração Nixpacks para Railway - BarberSaas API

[phases.setup]
nixPkgs = ["nodejs_22", "npm-9_x", "openssl"]

[phases.install]
cmds = ["npm ci --legacy-peer-deps"]

[phases.build]
cmds = ["cd apps/api && npm install && npx prisma generate && npm run build && chmod +x start.sh"]

[start]
cmd = "cd apps/api && sh start.sh"
